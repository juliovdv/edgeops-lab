server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 ipv6=off;

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
  }

  location /health/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
